<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos - POO V6</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonte suave e fofa do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<header>
    <h1>Registro De Produtos : Versão 6</h1>
</header>

<body>
    
    <div class="container">
        <!-- Seção de Busca e Ordenação (V6) -->
        <div class="search-sort-container">
            <div class="form-group search-group">
                <label for="busca">Pesquisar na Tabela:</label>
                <input type="text" id="busca" placeholder="Digite para filtrar os produtos..." />
            </div>
            
            <div class="form-group sort-group">
                <label for="ordenacao">Ordenar por:</label>
                <select id="ordenacao">
                    <option value="padrao">Padrão (Cadastro)</option>
                    <option value="menor-qtd">Menor Quantidade</option>
                    <option value="maior-preco">Maior Preço</option>
                    <option value="menor-preco">Menor Preço</option>
                    <option value="alfabetica">Ordem Alfabética (A–Z)</option>
                </select>
            </div>
        </div>

        <!-- Painel de Ações V6 (CSV e Backup/Restaurar) -->
        <div class="v6-actions">
            <button type="button" id="btn-exportar-csv" class="btn-primary btn-csv">Exportar CSV</button>
            <button type="button" id="btn-backup-json" class="btn-primary btn-backup">Backup JSON</button>
            
            <label for="input-restaurar-json" class="btn-primary btn-restaurar">
                Restaurar JSON
            </label>
            <input type="file" id="input-restaurar-json" accept=".json" class="input-file-hidden" />
        </div>

        <!-- Seção Superior: Header ao lado esquerdo do formulário -->
        <div class="top-section">
            <div class="header-topo">
                <img src="gatopng.png" alt="Gatinho fofo">
            </div>
            
            <!-- Formulário de Entrada -->
            <form id="produto-form">
                <div class="form-group">
                    <label for="nome">Nome do Produto:</label>
                    <input type="text" id="nome" placeholder="Ex: Cupcake de Morango" required/>
                </div>
                
                <div class="form-group">
                    <label for="preco">Preço (R$):</label>
                    <input type="number" id="preco" step="0.01" placeholder="Ex: 12.50" required />
                </div>
                
                <div class="form-group">
                    <label for="quantidade">Quantidade:</label>
                    <input type="number" id="quantidade" placeholder="Ex: 5" required />
                </div>
                
                <button type="submit" class="btn-primary">Adicionar Produto</button>
            </form>
        </div>
        
        <!-- Cabeçalho de Ações e Resumo -->
        <div class="resumo-container">
            <h3 id="total-estoque">Total em Estoque: R$ 0,00</h3>
            <button id="limpar-tabela" class="btn-danger">Limpar Tudo</button>
        </div>
        
        <!-- Tabela de Exibição -->
        <table id="tabela-produtos">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço Un.</th>
                    <th>Qtd.</th>
                    <th>Subtotal</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <!-- As linhas da tabela serão inseridas via JS -->
            </tbody>
        </table>

        <!-- Botão Conceito Bootstrap no Rodapé -->
        <div class="bootstrap-btn-container">
            <button type="button" id="btn-conceito-bootstrap" class="btn-danger btn-bootstrap">Ver Conceito Bootstrap</button>
        </div>
    </div>

    <!-- Container para Mensagem Inline / Erro no Formulário -->
    <div id="mensagem-erro" class="mensagem-erro-oculta"></div>

    <!-- Estrutura do Modal Customizado -->
    <div id="modal-customizado" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-titulo">Confirmação</h3>
            <p id="modal-texto"></p>
            <div id="modal-botoes" class="modal-botoes-container">
                <button type="button" id="modal-btn-cancelar" class="btn-danger">Cancelar</button>
                <button type="button" id="modal-btn-confirmar" class="btn-primary">Confirmar</button>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <img src="665d2db01e6fcb05a53f9d001c97b27e_0(1).jpg" alt="Foto do Rodapé" class="footer-img-circular">
        <p>Cadastro de Produtos V6 &copy; 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
